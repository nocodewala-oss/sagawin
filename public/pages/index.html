<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <title>Saga Win</title>

  <link rel="icon" type="image/x-icon" href="/assets/icon/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/icon/icon.png" />
  <link rel="preload" as="image" href="/assets/img/loading-mobile.webp" media="(max-width: 767px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/assets/img/loading-desktop.webp" media="(min-width: 768px)" fetchpriority="high" />

  <style>
    :root {
      --bg: #080507;
      --crimson: #8f1428;
      --gold: #f3c669;
      --gold-bright: #ffe4a3;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
    }

    #splashImg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
      display: block;
      z-index: 1;
      transform: translateZ(0);
    }

    .bottom-bar-wrap {
      position: fixed;
      bottom: calc(clamp(20px, 3.8vh, 36px) + env(safe-area-inset-bottom, 0px));
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(8, 5, 7, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
    }

    .progress-strip {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .brand-mini {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--gold-bright);
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .brand-mini img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: block;
      flex-shrink: 0;
    }

    .line-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .line-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--crimson), var(--gold), var(--gold-bright));
      box-shadow: 0 0 10px rgba(243, 198, 105, 0.65);
      will-change: width;
    }

    .pct {
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--gold);
      min-width: 36px;
      text-align: right;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <main class="stage">
    <img
      id="splashImg"
      src="/assets/img/loading-mobile.webp"
      data-active-src="/assets/img/loading-mobile.webp"
      alt="Saga Win"
      decoding="async"
      fetchpriority="high"
    />

    <div class="bottom-bar-wrap" aria-live="polite">
      <div class="progress-strip">
        <span class="brand-mini">
          <img src="/assets/icon/icon.png" onerror="this.onerror=null;this.src='/assets/icon/favicon.ico';" alt="" />
          SAGA WIN
        </span>
        <div class="line-track">
          <div class="line-fill" id="lineFill"></div>
        </div>
        <span class="pct" id="pctText">0%</span>
      </div>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      const DURATION_MS = 6000;
      const TARGET_URL = '/auth';

      const ASSETS = {
        mobileWebp: '/assets/img/loading-mobile.webp',
        mobilePng: '/assets/img/loading-mobile.png',
        desktopWebp: '/assets/img/loading-desktop.webp',
        desktopPng: '/assets/img/loading-desktop.png'
      };

      const runtime = {
        startedAt: performance.now(),
        ready: false,
        navigated: false,
        mediaQuery: window.matchMedia('(min-width: 768px)'),
        resizeTimer: null,
        fallbackIndex: 0
      };

      const splashImg = document.getElementById('splashImg');
      const lineFill = document.getElementById('lineFill');
      const pctText = document.getElementById('pctText');

      function safeCall(fn) {
        try {
          return fn();
        } catch (_) {
          return undefined;
        }
      }

      function applyUiGuards() {
        safeCall(() => {
          document.addEventListener('contextmenu', (e) => e.preventDefault(), { passive: false });
          document.addEventListener('dragstart', (e) => e.preventDefault(), { passive: false });
          document.addEventListener('selectstart', (e) => e.preventDefault(), { passive: false });
          document.addEventListener(
            'wheel',
            (e) => {
              if (e.ctrlKey || e.metaKey) e.preventDefault();
            },
            { passive: false }
          );
          document.addEventListener(
            'keydown',
            (e) => {
              if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) {
                e.preventDefault();
              }
            },
            { passive: false }
          );
          document.addEventListener(
            'touchmove',
            (e) => {
              if (e.touches && e.touches.length > 1) e.preventDefault();
            },
            { passive: false }
          );
        });
      }

      function getCandidateList() {
        const isDesktop = Boolean(runtime.mediaQuery && runtime.mediaQuery.matches);
        if (isDesktop) {
          return [ASSETS.desktopWebp, ASSETS.desktopPng, ASSETS.mobileWebp, ASSETS.mobilePng];
        }
        return [ASSETS.mobileWebp, ASSETS.mobilePng, ASSETS.desktopWebp, ASSETS.desktopPng];
      }

      function setImageByIndex(idx) {
        safeCall(() => {
          if (!splashImg) return;
          const list = getCandidateList();
          const clamped = Math.max(0, Math.min(idx, list.length - 1));
          const chosen = list[clamped];
          if (splashImg.getAttribute('data-active-src') !== chosen) {
            splashImg.setAttribute('data-active-src', chosen);
            splashImg.src = chosen;
          }
        });
      }

      function applyResponsiveImage() {
        runtime.fallbackIndex = 0;
        setImageByIndex(0);
      }

      if (splashImg) {
        splashImg.onerror = function () {
          safeCall(() => {
            const list = getCandidateList();
            runtime.fallbackIndex += 1;
            if (runtime.fallbackIndex < list.length) {
              setImageByIndex(runtime.fallbackIndex);
            }
          });
        };
      }

      function verifyClientEnvironment() {
        return safeCall(() => {
          const isLocal =
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1' ||
            location.hostname === '::1';
          const secureContext = window.isSecureContext || location.protocol === 'https:' || isLocal;
          const notFramed = window.self === window.top;

          let storageOk = false;
          try {
            const k = '__sw_probe__';
            sessionStorage.setItem(k, '1');
            sessionStorage.removeItem(k);
            storageOk = true;
          } catch (_) {
            storageOk = false;
          }

          window.__SW_SHELL__ = Object.freeze({
            secureContext: Boolean(secureContext),
            notFramed: Boolean(notFramed),
            storageOk: Boolean(storageOk),
            dpr: Math.min(window.devicePixelRatio || 1, 3),
            isDesktop: Boolean(runtime.mediaQuery && runtime.mediaQuery.matches)
          });

          return true;
        });
      }

      function fetchWithTimeout(url, options, timeoutMs) {
        return new Promise((resolve) => {
          let settled = false;
          const done = (val) => {
            if (!settled) {
              settled = true;
              resolve(val);
            }
          };

          const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
          const timer = setTimeout(() => {
            if (controller) safeCall(() => controller.abort());
            done(null);
          }, timeoutMs);

          const init = Object.assign({}, options || {}, controller ? { signal: controller.signal } : {});
          fetch(url, init)
            .then((res) => {
              clearTimeout(timer);
              done(res);
            })
            .catch(() => {
              clearTimeout(timer);
              done(null);
            });
        });
      }

      async function silentHealthWarmup() {
        for (let i = 0; i < 2; i++) {
          const res = await fetchWithTimeout(
            '/health',
            { method: 'GET', cache: 'no-store', credentials: 'same-origin' },
            2500
          );
          if (res && res.ok) return true;
          await new Promise((r) => setTimeout(r, 250));
        }
        return false;
      }

      function decodeImage(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.decoding = 'async';
          const finish = () => resolve(true);
          img.onload = () => {
            if (typeof img.decode === 'function') {
              img.decode().then(finish).catch(finish);
            } else {
              finish();
            }
          };
          img.onerror = finish;
          img.src = src;
        });
      }

      async function preloadAssets() {
        const candidates = getCandidateList();
        await Promise.all([
          decodeImage('/assets/icon/favicon.ico'),
          decodeImage('/assets/icon/icon.png'),
          decodeImage(candidates[0])
        ]);

        safeCall(() => {
          if (candidates[1]) decodeImage(candidates[1]);
        });
      }

      async function warmupTargetRoute() {
        await fetchWithTimeout(
          TARGET_URL,
          { method: 'HEAD', cache: 'no-store', credentials: 'same-origin' },
          2000
        );
      }

      function bindViewportStability() {
        safeCall(() => {
          const onResize = () => {
            applyResponsiveImage();
            clearTimeout(runtime.resizeTimer);
            runtime.resizeTimer = setTimeout(() => {
              if (window.__SW_SHELL__) {
                window.__SW_SHELL__ = Object.freeze(
                  Object.assign({}, window.__SW_SHELL__, {
                    isDesktop: Boolean(runtime.mediaQuery && runtime.mediaQuery.matches)
                  })
                );
              }
            }, 120);
          };
          window.addEventListener('resize', onResize, { passive: true });
          window.addEventListener('orientationchange', onResize, { passive: true });
        });
      }

      function navigateToAuth() {
        if (runtime.navigated) return;
        runtime.navigated = true;

        if (lineFill) lineFill.style.width = '100%';
        if (pctText) pctText.textContent = '100%';

        setTimeout(() => {
          safeCall(() => {
            window.location.replace(TARGET_URL);
          });
        }, 120);
      }

      function animateProgress(now) {
        if (runtime.navigated) return;

        const elapsed = Math.max(0, now - runtime.startedAt);
        const rawRatio = Math.min(elapsed / DURATION_MS, 1);

        const effectiveRatio = runtime.ready ? rawRatio : Math.min(rawRatio, 0.96);
        const pct = Math.min(100, Math.floor(effectiveRatio * 100));

        if (lineFill) {
          lineFill.style.width = (effectiveRatio * 100).toFixed(2) + '%';
        }
        if (pctText) {
          pctText.textContent = pct + '%';
        }

        if (rawRatio >= 1 && runtime.ready) {
          navigateToAuth();
          return;
        }

        requestAnimationFrame(animateProgress);
      }

      async function initPipeline() {
        applyUiGuards();
        applyResponsiveImage();
        bindViewportStability();
        verifyClientEnvironment();

        await Promise.allSettled([
          silentHealthWarmup(),
          preloadAssets(),
          warmupTargetRoute()
        ]);

        runtime.ready = true;
      }

      initPipeline();
      requestAnimationFrame(animateProgress);
    })();
  </script>
</body>
</html>
